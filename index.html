<!doctype html>
<html lang="en-IN">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="icon" type="image/png" sizes="192x192" href="/icon-192.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <!-- Installable app (Android/desktop "Install", iOS "Add to Home Screen") -->
    <link rel="manifest" href="/manifest.json" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-title" content="AthletiQ" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="format-detection" content="telephone=no" />
    <!-- Browser chrome follows the app theme on phones -->
    <meta name="theme-color" content="#f8fafc" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#0b1020" media="(prefers-color-scheme: dark)" />
    <meta name="description" content="AthletiQ — coaching academy management" />
    <link rel="canonical" href="https://www.edupilots.in/" />
    <!-- Link previews when the registration link is shared on WhatsApp and elsewhere -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="AthletiQ" />
    <meta property="og:title" content="AthletiQ — join the academy" />
    <meta
      property="og:description"
      content="Register as a student or coach in a couple of minutes."
    />
    <meta property="og:url" content="https://www.edupilots.in/register" />
    <link rel="preconnect" href="https://rsms.me/" />
    <link rel="stylesheet" href="https://rsms.me/inter/inter.css" />
    <title>AthletiQ</title>
    <script>
      // Apply the theme before first paint to avoid a light/dark flash.
      (function () {
        try {
          var t = localStorage.getItem('atq-theme') || 'system';
          var dark =
            t === 'dark' || (t === 'system' && matchMedia('(prefers-color-scheme: dark)').matches);
          document.documentElement.classList.toggle('dark', dark);
        } catch (e) {}
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <noscript>AthletiQ needs JavaScript enabled.</noscript>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
