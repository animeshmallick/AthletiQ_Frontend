version: 1
frontend:
  phases:
    preBuild:
      commands:
        # Node 22 LTS: Amplify's build image runs without root and lacks libatomic, which newer Node
        # binaries (26) need. The app supports Node >= 22.12; local dev and CI use .nvmrc (26).
        # --skip-default-packages avoids installing the Amplify CLI, Cypress, … on every build.
        - nvm install 22 --skip-default-packages && nvm use 22
        - node -v && npm -v
        - npm ci
    build:
      commands:
        # VITE_API_URL defaults to https://api.edupilots.in (.env.production); Amplify env vars override.
        - npm run build
  artifacts:
    baseDirectory: dist
    files:
      - '**/*'
  cache:
    paths:
      - node_modules/**/*
