version: 1
frontend:
  phases:
    preBuild:
      commands:
        # Node version from .nvmrc
        - nvm install && nvm use
        - npm ci
    build:
      commands:
        # VITE_API_URL and VITE_MAPBOX_TOKEN come from Amplify environment variables.
        - npm run build
  artifacts:
    baseDirectory: dist
    files:
      - '**/*'
  cache:
    paths:
      - node_modules/**/*
