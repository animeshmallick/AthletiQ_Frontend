    <title>AthletiQ</title>
    <script>
      // Apply the theme before first paint to avoid a light/dark flash.
      (function () {
        try {
          var t = localStorage.getItem('atq-theme') || 'system';
          var dark =
            t === 'dark' || (t === 'system' && matchMedia('(prefers-color-scheme: dark)').matches);
          document.documentElement.classList.toggle('dark', dark);
        } catch (e) {}
      })();
    </script>
    <!-- Animated launch screen: shown until the app has rendered (continues the native splash). -->
    <style>
      #boot {
        position: fixed;
        inset: 0;
        z-index: 2147483000;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        overflow: hidden;
        color: #fff;
        background: linear-gradient(160deg, #4338ca 0%, #5b45f0 55%, #7c3aed 100%);
        font-family: Inter, 'Segoe UI', Roboto, system-ui, sans-serif;
        transition:
          opacity 0.35s ease,
          transform 0.35s ease;
      }
      #boot.boot-done {
        opacity: 0;
        transform: scale(1.04);
        pointer-events: none;
      }
      #boot .glow {
        position: absolute;
        width: 140vmax;
        height: 140vmax;
        left: 50%;
        top: 42%;
        translate: -50% -50%;
        background: radial-gradient(circle, rgb(255 255 255 / 0.22), transparent 45%);
        animation: boot-breathe 2.4s ease-in-out infinite;
      }
      #boot .lanes {
        position: absolute;
        left: 0;
        bottom: 0;
        width: 100%;
        height: 45%;
      }
      #boot .lanes path {
        fill: none;
        stroke: #fff;
        stroke-width: 6;
        stroke-linecap: round;
        stroke-dasharray: 1;
        stroke-dashoffset: 1;
        animation: boot-draw 1.1s cubic-bezier(0.65, 0, 0.35, 1) forwards;
      }
      #boot .lanes path:nth-child(1) {
        stroke-opacity: 0.16;
      }
      #boot .lanes path:nth-child(2) {
        stroke-opacity: 0.11;
        animation-delay: 0.12s;
      }
      #boot .lanes path:nth-child(3) {
        stroke-opacity: 0.07;
        animation-delay: 0.24s;
      }
      #boot .lanes .runner {
        stroke: #fbbf24;
        stroke-width: 7;
        stroke-opacity: 0.9;
        stroke-dasharray: 0.06 0.94;
        stroke-dashoffset: 0;
        animation: boot-run 1.6s linear 0.6s infinite;
        opacity: 0;
      }
      #boot .mark {
        position: relative;
        width: min(36vw, 168px);
        height: auto;
        overflow: visible;
        animation: boot-float 2.6s ease-in-out 1.3s infinite;
      }
      #boot .mark .letter,
      #boot .mark .swoosh {
        fill: none;
        stroke-linecap: round;
        stroke-linejoin: round;
        stroke-dasharray: 1;
        stroke-dashoffset: 1;
      }
      #boot .mark .letter {
        stroke: #fff;
        stroke-width: 116;
        animation: boot-draw 0.6s cubic-bezier(0.65, 0, 0.35, 1) 0.15s forwards;
      }
      #boot .mark .swoosh {
        stroke: #fbbf24;
        stroke-width: 66;
        animation: boot-draw 0.45s cubic-bezier(0.65, 0, 0.35, 1) 0.6s forwards;
      }
      #boot .mark .speed path {
        stroke: #fff;
        stroke-width: 30;
        stroke-linecap: round;
        opacity: 0;
        animation: boot-dash 0.5s ease-out forwards;
      }
      #boot .mark .speed path:nth-child(1) {
        animation-delay: 0.35s;
      }
      #boot .mark .speed path:nth-child(2) {
        animation-delay: 0.42s;
      }
      #boot .mark .speed path:nth-child(3) {
        animation-delay: 0.49s;
      }
      #boot .mark .star {
        fill: #fbbf24;
        transform-box: fill-box;
        transform-origin: center;
        transform: scale(0);
        animation:
          boot-pop 0.45s cubic-bezier(0.34, 1.56, 0.64, 1) 0.95s forwards,
          boot-twinkle 1.8s ease-in-out 1.5s infinite;
      }
      #boot .word {
        position: relative;
        margin-top: 18px;
        font-size: 34px;
        font-weight: 800;
        letter-spacing: -0.02em;
        opacity: 0;
        transform: translateY(10px);
        animation: boot-rise 0.5s ease-out 0.85s forwards;
      }
      #boot .word b {
        color: #fbbf24;
        font-weight: 800;
      }
      #boot .tag {
        position: relative;
        margin-top: 6px;
        font-size: 11px;
        font-weight: 600;
        letter-spacing: 0.32em;
        opacity: 0;
        animation: boot-tag 0.7s ease-out 1.05s forwards;
      }
      #boot .bar {
        position: absolute;
        bottom: calc(env(safe-area-inset-bottom, 0px) + 56px);
        width: 112px;
        height: 4px;
        border-radius: 4px;
        background: rgb(255 255 255 / 0.18);
        overflow: hidden;
        opacity: 0;
        animation: boot-rise 0.4s ease-out 1.2s forwards;
      }
      #boot .bar::after {
        content: '';
        position: absolute;
        inset: 0;
        width: 40%;
        border-radius: inherit;
        background: linear-gradient(90deg, transparent, #fbbf24, transparent);
        animation: boot-slide 1.1s ease-in-out infinite;
      }
      @keyframes boot-draw {
        to {
          stroke-dashoffset: 0;
        }
      }
      @keyframes boot-run {
        0% {
          opacity: 0;
          stroke-dashoffset: 1;
        }
        15%,
        85% {
          opacity: 1;
        }
        100% {
          opacity: 0;
          stroke-dashoffset: 0;
        }
      }
      @keyframes boot-dash {
        from {
          opacity: 0;
          transform: translateX(-90px);
        }
        to {
          opacity: 0.6;
          transform: none;
        }
      }
      @keyframes boot-pop {
        from {
          transform: scale(0) rotate(-90deg);
        }
        to {
          transform: scale(1) rotate(0);
        }
      }
      @keyframes boot-twinkle {
        50% {
          transform: scale(0.75) rotate(45deg);
        }
      }
      @keyframes boot-rise {
        to {
          opacity: 1;
          transform: none;
        }
      }
      @keyframes boot-tag {
        from {
          opacity: 0;
          letter-spacing: 0.1em;
        }
        to {
          opacity: 0.75;
          letter-spacing: 0.32em;
        }
      }
      @keyframes boot-float {
        50% {
          transform: translateY(-6px);
        }
      }
      @keyframes boot-breathe {
        50% {
          opacity: 0.7;
        }
      }
      @keyframes boot-slide {
        from {
          transform: translateX(-100%);
        }
        to {
          transform: translateX(260%);
        }
      }
      @media (prefers-reduced-motion: reduce) {
        #boot *,
        #boot *::after {
          animation-duration: 1ms !important;
          animation-delay: 0s !important;
          animation-iteration-count: 1 !important;
        }
      }
    </style>
  </head>
  <body>
    <div id="boot" aria-hidden="true">
      <div class="glow"></div>
      <svg class="lanes" viewBox="0 0 1024 460" preserveAspectRatio="none">

          d="M-40 420 C260 140 760 90 1064 220"
        />
        <path

        <path

        />
        <path

          pathLength="1"
          vector-effect="non-scaling-stroke"
          d="M-40 420 C260 140 760 90 1064 220"
        />
      </svg>
      <svg class="mark" viewBox="150 220 760 600">
        <g class="speed">
          <path d="M214 452H330" />
          <path d="M170 536H318" />
          <path d="M232 620H316" />
        </g>
        <path class="letter" pathLength="1" d="M330 772 548 254 736 772" />
        <path class="swoosh" pathLength="1" d="M390 640C500 628 640 580 796 444" />
        <path class="star" d="M830 236l24 62 62 24-62 24-24 62-24-62-62-24 62-24z" />
      </svg>
      <div class="word">Athleti<b>Q</b></div>
      <div class="tag">TRAIN · TRACK · THRIVE</div>
      <div class="bar"></div>
    </div>
    <script>
      // Hide the launch screen once the app has rendered. Installed apps keep it long enough for
      // the animation to finish; a browser tab only avoids a flash. Failsafe after 8s.
      (function () {
        var app =
          !!window.Capacitor ||
          navigator.standalone === true ||
          matchMedia('(display-mode: standalone)').matches;
        window.atqReady = function () {
          var el = document.getElementById('boot');
          if (!el || el.getAttribute('data-done')) return;
          el.setAttribute('data-done', '1');
          var wait = Math.max(0, (app ? 1500 : 350) - performance.now());
          setTimeout(function () {
            el.classList.add('boot-done');
            setTimeout(function () {
              el.remove();
            }, 400);
          }, wait);
        };
        setTimeout(window.atqReady, 8000);
      })();
    </script>
    <div id="root"></div>
    <noscript>AthletiQ needs JavaScript enabled.</noscript>
    <script type="module" src="/src/main.tsx"></script>
  </body>
