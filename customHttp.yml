# AWS Amplify custom headers. Hashed assets are cached forever; index.html never.
customHeaders:
  - pattern: '**/*'
    headers:
      - key: Strict-Transport-Security
        value: max-age=31536000; includeSubDomains
      - key: X-Content-Type-Options
        value: nosniff
      - key: X-Frame-Options
        value: DENY
      - key: Referrer-Policy
        value: strict-origin-when-cross-origin
      - key: Permissions-Policy
        value: geolocation=(self), camera=(), microphone=()
  - pattern: 'assets/**'
    headers:
      - key: Cache-Control
        value: public, max-age=31536000, immutable
  - pattern: 'index.html'
    headers:
      - key: Cache-Control
        value: no-cache
